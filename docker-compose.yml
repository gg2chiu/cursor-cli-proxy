services:
  cursor-cli-proxy:
    build: .
    container_name: cursor-cli-proxy
    ports:
      - "${HOST:-127.0.0.1}:${PORT:-8000}:${PORT:-8000}"
    environment:
      # Configuration variables from README.md
      - CURSOR_KEY=${CURSOR_KEY:-}
      - HOST=0.0.0.0 # Set to 0.0.0.0 to expose the service to external connections
      - PORT=${PORT:-8000}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENABLE_INFO_IN_THINK=${ENABLE_INFO_IN_THINK:-false}
      - ENABLE_SKILLS_IN_PROMPT=${ENABLE_SKILLS_IN_PROMPT:-false}
      - ENABLE_THINKING_OUTPUT=${ENABLE_THINKING_OUTPUT:-true}
      - ENABLE_TOOL_CALL_OUTPUT=${ENABLE_TOOL_CALL_OUTPUT:-true}
      - WORKSPACE_WHITELIST_1=${WORKSPACE_WHITELIST_1:-}
      - WORKSPACE_WHITELIST_2=${WORKSPACE_WHITELIST_2:-}
      - WORKSPACE_WHITELIST_3=${WORKSPACE_WHITELIST_3:-}
      - WORKSPACE_WHITELIST_4=${WORKSPACE_WHITELIST_4:-}
      - WORKSPACE_WHITELIST_5=${WORKSPACE_WHITELIST_5:-}
    volumes:
      # Session persistence
      # - ./sessions.json:/app/sessions.json:rw
      # Models persistence
      # - ./models.json:/app/models.json:rw
      # Workspace mounts (uncomment and set paths as needed)
      # - ${WORKSPACE_WHITELIST_1}:${WORKSPACE_WHITELIST_1}:rw
      # - ${WORKSPACE_WHITELIST_2}:${WORKSPACE_WHITELIST_2}:rw
      # - ${WORKSPACE_WHITELIST_3}:${WORKSPACE_WHITELIST_3}:rw
      # - ${WORKSPACE_WHITELIST_4}:${WORKSPACE_WHITELIST_4}:rw
      # - ${WORKSPACE_WHITELIST_5}:${WORKSPACE_WHITELIST_5}:rw
      # SSH keys and gitconfig
      # - /home/user/.ssh/id_rsa:/root/.ssh/id_rsa:ro
      # - /home/user/.ssh/known_hosts:/root/.ssh/known_hosts:ro
      # - /home/user/.gitconfig:/root/.gitconfig:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:${PORT:-8000}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s